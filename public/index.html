<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RV AI Assistant — Playa</title>
  <meta name="description" content="Offline quick-reference for operating a rented Class A motorhome at Burning Man. Works with no signal.">
  <meta name="theme-color" content="#1b1610">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RV AI Playa">
  <meta name="application-name" content="RV AI Playa">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="RV AI Assistant — Playa">
  <meta property="og:description" content="Offline quick-reference for operating a rented Class A motorhome at Burning Man.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="header-row">
      <button id="brand-home" class="brand" type="button">
        <picture id="brand-logo" class="brand-logo" hidden>
          <source id="brand-logo-dark" media="(prefers-color-scheme: dark)">
          <img id="brand-logo-image" alt="El Monte RV">
        </picture>
        <span class="brand-text">
          <span id="brand-name" class="brand-name">RV AI Assistant — Playa</span>
          <span id="brand-status" class="brand-status">Unofficial companion guide.</span>
        </span>
      </button>
      <nav class="header-nav" aria-label="App sections">
        <button id="nav-offline" class="nav-button" type="button">Offline</button>
        <button id="nav-install" class="nav-button" type="button">Install</button>
        <button id="nav-about" class="nav-button" type="button">About</button>
      </nav>
    </div>

    <form id="search-form" class="search-form" role="search">
      <label class="visually-hidden" for="search-input">Search the guide</label>
      <input
        id="search-input"
        class="search-input"
        type="search"
        name="q"
        placeholder="What is happening? e.g. no water, alarm, dust storm"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        enterkeyhint="search">
      <button id="clear-search" class="search-clear" type="button" aria-label="Clear search">&times;</button>
      <button class="search-submit" type="submit">Search</button>
    </form>

    <button id="offline-badge" class="offline-badge" type="button" hidden>Checking offline status…</button>

    <div id="update-banner" class="update-banner" role="status" hidden>
      <span>A newer version of this app is downloaded and ready.</span>
      <button id="update-apply" class="button button--primary" type="button">Update now</button>
    </div>
  </header>

  <main id="main" class="app-main" tabindex="-1">
    <p class="muted">Loading the guide…</p>
  </main>

  <footer class="app-footer">
    <p id="footer-text"></p>
    <p id="footer-reference" class="muted"></p>
    <p class="muted">Emergency? Call 911 or Burning Man emergency services. Find the On Road Care number on the key tag.</p>
  </footer>

  <noscript>
    <p class="notice notice--warn">This guide needs JavaScript. Enable it, then reload while you still have signal so the app can cache itself for offline use.</p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
